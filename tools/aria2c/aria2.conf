# aria2 configuration for ps5-lan-bootstrap
# Zero-human-touch, secure, HDD-protective settings

enable-rpc=true
rpc-listen-port=6800
rpc-listen-all=false
rpc-allow-origin-all=true
rpc-secret=ps5_lan_secret_2026

# Seguridad estricta TLS (Regla de oro: validar certificados)
check-certificate=true

# Protección contra saturación y thrashing de HDD
max-concurrent-downloads=1
max-connection-per-server=8
split=8
min-split-size=10M
continue=true
# Resiliencia ante micro-cortes de red (el pilot reencola a nivel ítem tras 3 fallos)
retry-wait=5
max-tries=20
connect-timeout=60
timeout=120
disk-cache=64M
file-allocation=trunc

# Persistencia de sesión
save-session-interval=30
save-session=E:\ps5\data\cache\ps5\aria2.session
input-file=E:\ps5\data\cache\ps5\aria2.session

# Trazabilidad
log=E:\ps5\data\logs\aria2.log
log-level=notice
console-log-level=warn
